<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALG nettside, Gruppe 1</title>
    <link rel="stylesheet" href="style.css">

    <!-- Anton og Afacad font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400..700&family=Anton&display=swap" rel="stylesheet">
</head>
<body>
    <div class="divBoks">
        <div class="høyre">
            <p class="anton overskrift">VALG</p>

            <p class="afacadBold loggInn">LOGG INN</p>
            <input type="text" class="kodeBoks" id="kode" placeholder="Koden du fikk fra ..." required>
            <button type="submit" class="okKnapp" id="okKnapp" onclick="okKnapp()">OK</button>

            <p class="afacad instruksjoner">Steg: <br>
            1. Velg din klasse og logg inn med <br>
            koden du har fått. <br>
            2. Velg kandidaten du stemmer for. <br>
            3. Send inn svaret ditt.</p>
        </div>
        <div class="venstre">
            <div class="forsideBilde"></div> <!-- PLACEHOLDER -->
        </div>

    </div>
    <div class="bunn"><p class="afacad">NETTSIDE LAGET AV AKI, KONRAD, MATHIAS OG ZULIHAN</p></div>
    
    <script src="script.js"></script>
</body>
</html>
